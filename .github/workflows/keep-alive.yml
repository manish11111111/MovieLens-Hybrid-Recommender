name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app and wake if sleeping
        env:
          APP_URL: https://movielens-hybrid-recommender1111.streamlit.app/
        run: python wake.py